<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>点物GEO 文章多平台同步助手</title>
    <script type="module" crossorigin src="../../assets/popup-CxDw5Zvb.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/_commonjsHelpers-BosuxZz1.js">
    <link rel="modulepreload" crossorigin href="../../assets/globals-DmOqlBAC.js">
    <link rel="modulepreload" crossorigin href="../../assets/logger-CvfM-6aa.js">
    <link rel="modulepreload" crossorigin href="../../assets/analytics-XA79Jluk.js">
    <link rel="stylesheet" crossorigin href="../../assets/globals-D_07OMId.css">
  </head>
  <body>
    <div id="root"></div>
    <script src="../../popup-family-sync.js"></script>
    <script src="../../popup-article-hotreload.js"></script>
    <script src="../../popup-sync-bridge-settings.js"></script>
    <style>
      /* Fit Chrome action-popup max height so the BROWSER chrome never scrolls */
      html,
      body {
        margin: 0;
        overflow: hidden !important;
        width: 420px;
        height: 600px;
        max-height: 600px;
      }
      #root {
        margin: 0;
        overflow: hidden !important;
        width: 100%;
        height: 100%;
        max-height: 100%;
      }
      /* App shell */
      #root > div.flex.flex-col {
        height: 100% !important;
        max-height: 100% !important;
        overflow: hidden !important;
      }
      /* Only the platform list / main content scrolls */
      #root main {
        overflow-x: hidden !important;
        overflow-y: auto !important;
        flex: 1 1 0 !important;
        min-height: 0 !important;
      }
      /*
       * Stock popup uses Tailwind animate-pulse (opacity 1→0.5) on the
       * platform currently syncing — Chinese labels look muddy/blurry.
       * Keep a ring pulse instead; never dim the text.
       */
      @keyframes dwgeo-sync-ring {
        0%,
        100% {
          box-shadow: inset 0 0 0 2px rgb(37 99 235 / 0.35);
        }
        50% {
          box-shadow: inset 0 0 0 2px rgb(37 99 235 / 0.95);
        }
      }
      #root main button.animate-pulse {
        animation: dwgeo-sync-ring 1.2s ease-in-out infinite !important;
        opacity: 1 !important;
      }
      #root main button.animate-pulse span {
        opacity: 1 !important;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      /* Sync footer: higher-contrast blue (avoid washed blue-on-blue-50) */
      #root footer .bg-blue-50 span.text-blue-700,
      #root footer .bg-blue-50 span.text-blue-600,
      #root footer .bg-blue-50 span.text-blue-500 {
        color: #1e40af !important;
        font-weight: 600;
        opacity: 1 !important;
      }
    </style>
  </body>
</html>
